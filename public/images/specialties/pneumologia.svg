<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Circular purple border around icon, without fill -->
  <circle cx="50" cy="50" r="46" stroke="#541E87" stroke-width="2.5" fill="none"/>
  
  <g transform="translate(50, 50) scale(0.8) translate(-50, -50)">
    <!-- Trachea / windpipe -->
    <path d="M50 15 V42" stroke="#541E87" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M44 21 H56" stroke="#7B2CBF" stroke-width="3" stroke-linecap="round"/>
    <path d="M43 28 H57" stroke="#7B2CBF" stroke-width="3" stroke-linecap="round"/>
    <path d="M44 35 H56" stroke="#7B2CBF" stroke-width="3" stroke-linecap="round"/>
    <!-- Bronchi bifurcation -->
    <path d="M50 42 C46 47 38 52 30 55" stroke="#541E87" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M50 42 C54 47 62 52 70 55" stroke="#541E87" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Left Lung in distinct purple fill and outline -->
    <path d="M46 45 C38 43 26 48 22 58 C18 69 22 84 34 85 C42 85 45 78 46 68 C46.5 60 46.5 50 46 45 Z" fill="#9B51E0" fill-opacity="0.18" stroke="#541E87" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Right Lung in distinct purple fill and outline -->
    <path d="M54 45 C62 43 74 48 78 58 C82 69 78 84 66 85 C58 85 55 78 54 68 C53.5 60 53.5 50 54 45 Z" fill="#9B51E0" fill-opacity="0.18" stroke="#541E87" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Alveoli / internal branch details in bright purple -->
    <path d="M30 58 C32 64 36 68 38 72" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M70 58 C68 64 64 68 62 72" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
