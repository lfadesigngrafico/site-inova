<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Circular purple border around icon, without fill -->
  <circle cx="50" cy="50" r="46" stroke="#541E87" stroke-width="2.5" fill="none"/>
  
  <g transform="translate(50, 50) scale(0.8) translate(-50, -50)">
    <!-- ICU Monitor Screen Frame -->
    <rect x="18" y="20" width="64" height="48" rx="8" fill="#9B51E0" fill-opacity="0.12" stroke="#541E87" stroke-width="4"/>
    <!-- Monitor Stand -->
    <path d="M42 68 L36 82 H64 L58 68" stroke="#541E87" stroke-width="3.5" stroke-linejoin="round" fill="#7B2CBF" fill-opacity="0.25"/>
    <path d="M30 82 H70" stroke="#541E87" stroke-width="4" stroke-linecap="round"/>
    <!-- ECG Vitals Waveform inside monitor in bright vivid purple -->
    <path d="M24 44 H34 L38 34 L43 56 L47 38 L51 47 L54 44 H76" stroke="#A855F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Secondary vital line in medium purple -->
    <path d="M24 54 H46" stroke="#7B2CBF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M54 54 H72" stroke="#7B2CBF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Status indicator in light purple -->
    <circle cx="70" cy="30" r="3" fill="#C084FC"/>
  </g>
</svg>
